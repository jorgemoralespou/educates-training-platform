{{ $modules := (.Scratch.Get "__modules__") }}
{{ $current_module := (index $modules (trim (substr (.Page.RelPermalink) (len (relURL ""))) "/")) }}

<div class="header page-navbar sticky-top bg-primary">
    <div class="row row-no-gutters">
        <div class="col-sm-12">
            <div class="btn-group btn-group-sm" role="group">
                <form action='{{ relURL "" }}'>
                    <button class="btn btn-transparent" id="header-goto-home" type="submit" aria-label="home"><span
                            class="fas fa-home fa-inverse" aria-hidden="true"></span></button>
                </form>
            </div>
            <div class="btn-toolbar float-end" role="toolbar">
                <div class="btn-group btn-group-sm" role="group">
                    <form action="{{ relURL $current_module.prev_page }}" style="display: none;">
                        <button class="btn btn-transparent" id="header-prev-page" type="submit" {{ if (not
                            $current_module.prev_page) }}disabled="" {{ end }} aria-label="Prev"><span
                                class="fas fa-arrow-left fa-inverse" aria-hidden="true"></span></button>
                    </form>
                    <form style="display: none;">
                        <button class="btn btn-transparent" id="header-goto-toc" type="button" aria-label="TOC"
                            data-toc-toggle aria-controls="table-of-contents" aria-expanded="false"><span class="fas fa-list fa-inverse"
                                aria-hidden="true"></span></button>
                    </form>
                    <span class="header-step-counter" aria-label="Progress" style="display: none;">
                        {{ $current_module.step }} / {{ len $modules }}
                    </span>
                    {{ if not $current_module.next_page }}
                    <form>
                        <button class="btn btn-transparent" id="header-print-page" type="button" aria-label="Print"
                            onclick="window.open('{{ relURL "print.html" }}', '_blank')"><span class="fas fa-print fa-inverse"
                                aria-hidden="true"></span></button>
                    </form>
                    {{ end }}
                    <form action="{{ relURL $current_module.next_page }}" style="display: none;">
                        <button class="btn btn-transparent" id="header-next-page" type="submit" {{ if (not
                            $current_module.next_page) }}disabled="" {{ end }} aria-label="Next"><span
                                class="fas fa-arrow-right fa-inverse" aria-hidden="true"></span></button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    {{ if $modules }}
    <div class="header-progress-track" style="display: none;">
        <div class="header-progress-bar" style="width: {{ math.Round (mul (div (float $current_module.step) (len $modules)) 100) }}%;"></div>
    </div>
    {{ end }}
</div>
