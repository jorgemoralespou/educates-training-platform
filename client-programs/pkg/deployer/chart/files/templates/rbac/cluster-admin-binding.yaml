{{/*
  Development shortcut: bind the operator ServiceAccount to the
  built-in cluster-admin ClusterRole.

  Why this is needed: the operator drives Helm SDK installs of upstream
  charts (cert-manager, Contour, Kyverno, external-dns). Those installs
  apply every resource the chart contains — ServiceAccounts,
  ClusterRoles, RoleBindings, Services, ConfigMaps,
  ValidatingWebhookConfigurations, Deployments, CRDs — under the
  operator's own ServiceAccount. Kubernetes RBAC requires the actor to
  hold at least the permissions of the resources it creates, so any
  scoping narrower than cluster-admin breaks on the first new chart
  resource type we don't pre-enumerate.

  Why this is acceptable today: the operator is the only consumer of
  cluster services (there is no umbrella chart). This binding will be
  replaced with a fine-grained ClusterRole derived from the manifests
  every vendored chart actually produces; until then, this is the
  "cluster-admin shortcut" referenced from the RBAC comment block in
  internal/controller/config/educatesclusterconfig_controller.go.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: educates-installer-cluster-admin
  labels:
    {{- include "educates-installer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: educates-installer
    namespace: {{ .Release.Namespace }}
