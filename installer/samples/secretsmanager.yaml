# Minimal SecretsManager CR. Apply after the operator has reconciled
# an EducatesClusterConfig to Ready=True — the SecretsManager reconciler
# refuses to proceed until then.
#
# The operator installs the secrets-manager runtime via the in-repo
# `secrets-manager` subchart (vendored into the operator image) and
# co-locates it in the `educates` namespace alongside future
# LookupService / SessionManager installs.
#
# Most fields are optional: empty values mean "derive from the chart's
# appVersion + EducatesClusterConfig.status.imageRegistry".
---
apiVersion: platform.educates.dev/v1alpha1
kind: SecretsManager
metadata:
  name: cluster
spec:
  logLevel: info
  # image:
  #   repository: ghcr.io/educates/educates-secrets-manager
  #   tag: 3.7.1
  # resources:
  #   requests: { cpu: 50m, memory: 128Mi }
  #   limits:   { cpu: 200m, memory: 256Mi }
