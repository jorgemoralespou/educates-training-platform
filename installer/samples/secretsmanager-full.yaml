# SecretsManager with every spec field populated. See
# secretsmanager.yaml for the minimal form and the apply-order
# prerequisites (EducatesClusterConfig must be Ready first).
#
# secrets-manager is a pod-level singleton (the upstream implementation
# can't scale beyond one replica) so there is no replicas knob.
# Image-pull credentials are inherited from
# EducatesClusterConfig.status.imageRegistry.pullSecrets, not duplicated
# here.
---
apiVersion: platform.educates.dev/v1alpha1
kind: SecretsManager
metadata:
  name: cluster
spec:
  # Both image fields are optional; empty values derive from the
  # vendored chart's appVersion-based inventory (and the registry
  # prefix from EducatesClusterConfig.status.imageRegistry).
  image:
    repository: ghcr.io/educates/educates-secrets-manager
    tag: 4.0.0
  # debug | info | warn | error (default info)
  logLevel: debug
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
