# Local kind scenario: BundledCertManager + CustomCA + BundledContour.
# No external DNS; no policy enforcement. The shortest path to a working
# Managed-mode install — useful for smoke tests on a developer machine.
#
# Prerequisite: a CA key pair Secret in the operator namespace whose
# tls.crt and tls.key form a CA the workshop client trusts (self-signed is
# fine for local development). The operator copies it into cert-manager's
# namespace and the wildcard ClusterIssuer signs from it. Educates
# components never see this Secret: the operator derives the key-free
# educates-ingress-ca from it, holding only the CA certificate as ca.crt.
#
#   kubectl -n educates-installer create secret tls educates-custom-ca \
#     --cert=ca.crt --key=ca.key
---
apiVersion: config.educates.dev/v1alpha1
kind: EducatesClusterConfig
metadata:
  name: cluster
spec:
  mode: Managed
  ingress:
    domain: educates.test
    ingressClassName: contour
    controller:
      provider: BundledContour
    certificates:
      provider: BundledCertManager
      bundledCertManager:
        issuerType: CustomCA
        customCA:
          caKeyPairSecretRef:
            name: educates-custom-ca
  policyEnforcement:
    clusterPolicy:
      engine: Kyverno
    workshopPolicy:
      engine: Kyverno
    kyverno:
      provider: Bundled
