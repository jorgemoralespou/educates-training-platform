# Values for `helm install -f <this-file>` against the v4 chart.
#
# Kind + HTTPS scenario — see description.md for context. The wildcard
# TLS Secret and CA Secret are pre-created in the `educates-secrets`
# namespace by pre-install.sh; the chart auto-derives a SecretCopier from
# the cross-namespace `clusterIngress.{tls,ca}CertificateRef` so the
# runtime finds the Secrets locally.

lookup-service:
  enabled: false
remote-access:
  enabled: false

secrets-manager:
  image:
    tag: "3.7.1"

session-manager:
  # image.tag and imageVersions inherit the chart defaults (runtimeVersion: 3.7.1).

  clusterIngress:
    domain: ${DOMAIN}
    # protocol auto-derives to "https" because tlsCertificateRef.name is set.
    tlsCertificateRef:
      name: wildcard-tls
      namespace: educates-secrets
    caCertificateRef:
      name: wildcard-ca
      namespace: educates-secrets

  clusterSecurity:
    policyEngine: Kyverno

  workshopSecurity:
    rulesEngine: Kyverno

  imageRegistry:
    host: ghcr.io
    namespace: educates

  trainingPortal:
    credentials:
      admin:
        username: educates
        password: educates
      robot:
        username: robot@educates
        password: robot
    clients:
      robot:
        id: robot-client-id
        secret: robot-client-secret

  imagePuller:
    enabled: false
