# Values for `helm install -f <this-file>` against the v4 chart.
#
# Kind + HTTPS scenario — see description.md for context. The wildcard
# TLS Secret and CA Secret are pre-created in the `educates-secrets`
# namespace by pre-install.sh; the chart auto-derives a SecretCopier from
# the cross-namespace `clusterIngress.{tls,ca}CertificateRef` so the
# runtime finds the Secrets locally. They have the shapes the operator's
# StaticCertificate provider takes: `wildcard-tls` holds only tls.crt and
# tls.key, and `wildcard-ca` is a CA trust Secret holding only ca.crt.

lookup-service:
  enabled: false
remote-access:
  enabled: false

global:
  clusterIngress:
    domain: ${DOMAIN}
    # protocol auto-derives to "https" because tlsCertificateRef.name is set.
    tlsCertificateRef:
      name: wildcard-tls
      namespace: educates-secrets
    caCertificateRef:
      name: wildcard-ca
      namespace: educates-secrets

session-manager:
  trainingPortal:
    credentials:
      admin:
        username: educates
        password: educates
      robot:
        username: robot@educates
        password: robot
    clients:
      robot:
        id: robot-client-id
        secret: robot-client-secret
