# Same as scenario 01 plus user-supplied Kyverno ClusterPolicy
# extras on both paths (cluster-wide via clusterSecurity, per-workshop
# via workshopSecurity), on top of the chart-bundled baseline + ops
# set. The post-deploy hook asserts both that the per-environment
# ClusterPolicy the runtime spawns contains rules from the bundle, and
# that the user-supplied marker rule is among them.

lookup-service:
  enabled: false
remote-access:
  enabled: false

global:
  clusterIngress:
    domain: ${DOMAIN}

session-manager:
  trainingPortal:
    credentials:
      admin:
        username: educates
        password: educates
      robot:
        username: robot@educates
        password: robot
    clients:
      robot:
        id: robot-client-id
        secret: robot-client-secret

  # Cluster-wide policy enforcement via Kyverno (the chart default).
  # The chart applies the bundled cluster-policies (PSS baseline +
  # restricted) plus the user-supplied marker ClusterPolicy below.
  clusterSecurity:
    additionalKyvernoPolicies:
      - apiVersion: kyverno.io/v1
        kind: ClusterPolicy
        metadata:
          name: scenario-06-cluster-marker
        spec:
          validationFailureAction: Audit
          background: true
          rules:
            - name: scenario-06-cluster-marker
              match:
                any:
                  - resources:
                      kinds: [Pod]
              validate:
                message: "scenario-06 cluster placeholder — never matches"
                cel:
                  expressions:
                    - expression: "true"

  # Per-workshop rules via Kyverno (the chart default). The chart appends
  # the user marker to the bundled workshop-policies feed; session-manager
  # clones the combined set per-environment and the post-deploy hook
  # asserts the marker rule appears on `educates-environment-<env>`.
  workshopSecurity:
    additionalKyvernoPolicies:
      - apiVersion: kyverno.io/v1
        kind: ClusterPolicy
        metadata:
          name: scenario-06-workshop-marker
        spec:
          validationFailureAction: Audit
          background: true
          rules:
            - name: scenario-06-workshop-marker
              match:
                any:
                  - resources:
                      kinds: [Pod]
              validate:
                message: "scenario-06 workshop placeholder — never matches"
                cel:
                  expressions:
                    - expression: "true"
