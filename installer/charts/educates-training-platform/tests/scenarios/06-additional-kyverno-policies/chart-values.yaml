# Same as scenario 01 plus user-supplied Kyverno policy extras on both
# paths (cluster-wide via clusterSecurity, per-workshop via
# workshopSecurity), on top of the chart-bundled baseline + ops set.
# Each path supplies both accepted kinds: a legacy ClusterPolicy
# (kyverno.io) and a new ValidatingPolicy (policies.kyverno.io). The
# post-deploy hook asserts the bundled cluster ValidatingPolicies are
# namespace-scoped, that both user cluster markers are applied verbatim,
# and that the per-environment objects the runtime spawns carry the
# bundled workshop policies plus both user workshop markers (the
# ValidatingPolicy as its own scoped object, the ClusterPolicy merged
# into the legacy educates-environment-<env> ClusterPolicy).

lookup-service:
  enabled: false
remote-access:
  enabled: false

global:
  clusterIngress:
    domain: ${DOMAIN}

session-manager:
  trainingPortal:
    credentials:
      admin:
        username: educates
        password: educates
      robot:
        username: robot@educates
        password: robot
    clients:
      robot:
        id: robot-client-id
        secret: robot-client-secret

  # Cluster-wide policy enforcement via Kyverno (the chart default).
  # The chart applies the bundled cluster-policies (PSS baseline +
  # restricted) plus the user-supplied marker ClusterPolicy below.
  clusterSecurity:
    additionalKyvernoPolicies:
      - apiVersion: kyverno.io/v1
        kind: ClusterPolicy
        metadata:
          name: scenario-06-cluster-marker
        spec:
          validationFailureAction: Audit
          background: true
          rules:
            - name: scenario-06-cluster-marker
              match:
                any:
                  - resources:
                      kinds: [Pod]
              validate:
                message: "scenario-06 cluster placeholder — never matches"
                cel:
                  expressions:
                    - expression: "true"
      - apiVersion: policies.kyverno.io/v1alpha1
        kind: ValidatingPolicy
        metadata:
          name: scenario-06-cluster-marker-vp
        spec:
          validationActions: [Audit]
          evaluation:
            background:
              enabled: true
          matchConstraints:
            resourceRules:
              - apiGroups: [""]
                apiVersions: ["v1"]
                operations: ["CREATE", "UPDATE"]
                resources: ["pods"]
          validations:
            - expression: "true"
              message: "scenario-06 cluster VP placeholder — never matches"

  # Per-workshop rules via Kyverno (the chart default). The chart appends
  # the user marker to the bundled workshop-policies feed; session-manager
  # clones the combined set per-environment and the post-deploy hook
  # asserts the marker rule appears on `educates-environment-<env>`.
  workshopSecurity:
    additionalKyvernoPolicies:
      - apiVersion: kyverno.io/v1
        kind: ClusterPolicy
        metadata:
          name: scenario-06-workshop-marker
        spec:
          validationFailureAction: Audit
          background: true
          rules:
            - name: scenario-06-workshop-marker
              match:
                any:
                  - resources:
                      kinds: [Pod]
              validate:
                message: "scenario-06 workshop placeholder — never matches"
                cel:
                  expressions:
                    - expression: "true"
      - apiVersion: policies.kyverno.io/v1alpha1
        kind: ValidatingPolicy
        metadata:
          name: scenario-06-workshop-marker-vp
        spec:
          validationActions: [Audit]
          evaluation:
            background:
              enabled: true
          matchConstraints:
            resourceRules:
              - apiGroups: [""]
                apiVersions: ["v1"]
                operations: ["CREATE", "UPDATE"]
                resources: ["pods"]
          validations:
            - expression: "true"
              message: "scenario-06 workshop VP placeholder — never matches"
