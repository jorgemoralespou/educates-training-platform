# Same as scenario 01 plus user-supplied Kyverno ClusterPolicy
# extras on both paths (cluster-wide via clusterSecurity, per-workshop
# via workshopSecurity), on top of the chart-bundled baseline + ops
# set. The post-deploy hook asserts both that the per-environment
# ClusterPolicy the runtime spawns contains rules from the bundle, and
# that the user-supplied marker rule is among them.

lookup-service:
  enabled: false
remote-access:
  enabled: false

secrets-manager:
  image:
    tag: "3.7.1"

session-manager:
  # image.tag and imageVersions inherit the chart defaults (runtimeVersion: 3.7.1).

  clusterIngress:
    domain: ${DOMAIN}

  imageRegistry:
    host: ghcr.io
    namespace: educates

  trainingPortal:
    credentials:
      admin:
        username: educates
        password: educates
      robot:
        username: robot@educates
        password: robot
    clients:
      robot:
        id: robot-client-id
        secret: robot-client-secret

  # Cluster-wide policy enforcement via Kyverno. The chart applies the
  # bundled cluster-policies (PSS baseline + restricted) plus the
  # user-supplied marker ClusterPolicy below.
  clusterSecurity:
    policyEngine: Kyverno
    additionalKyvernoPolicies:
      - apiVersion: kyverno.io/v1
        kind: ClusterPolicy
        metadata:
          name: scenario-06-cluster-marker
        spec:
          validationFailureAction: Audit
          background: true
          rules:
            - name: scenario-06-cluster-marker
              match:
                any:
                  - resources:
                      kinds: [Pod]
              validate:
                message: "scenario-06 cluster placeholder — never matches"
                cel:
                  expressions:
                    - expression: "true"

  # Per-workshop rules via Kyverno. The chart appends the user marker
  # to the bundled workshop-policies feed; session-manager clones the
  # combined set per-environment and the post-deploy hook asserts the
  # marker rule appears on `educates-environment-<env>`.
  workshopSecurity:
    rulesEngine: Kyverno
    additionalKyvernoPolicies:
      - apiVersion: kyverno.io/v1
        kind: ClusterPolicy
        metadata:
          name: scenario-06-workshop-marker
        spec:
          validationFailureAction: Audit
          background: true
          rules:
            - name: scenario-06-workshop-marker
              match:
                any:
                  - resources:
                      kinds: [Pod]
              validate:
                message: "scenario-06 workshop placeholder — never matches"
                cel:
                  expressions:
                    - expression: "true"

  imagePuller:
    enabled: false
