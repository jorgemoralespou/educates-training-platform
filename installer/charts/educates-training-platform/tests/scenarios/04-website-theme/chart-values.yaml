# Same as scenario 01 + a custom default website theme. The content
# here is intentionally trivial — we only verify it lands in the
# `default-website-theme` Secret in the operator namespace, not that
# the portal renders it (a runtime concern).

lookup-service:
  enabled: false
remote-access:
  enabled: false

global:
  clusterIngress:
    domain: ${DOMAIN}

session-manager:
  trainingPortal:
    credentials:
      admin:
        username: educates
        password: educates
      robot:
        username: robot@educates
        password: robot
    clients:
      robot:
        id: robot-client-id
        secret: robot-client-secret

  # The thing under test: a custom training-portal theme with unique
  # markers that post-install.sh greps for in the rendered Secret.
  # `script` -> training-portal.js, `style` -> training-portal.css,
  # `html` -> training-portal.html (chart maps the structured triple
  # to the flat secret keys the runtime expects).
  websiteStyling:
    inline:
      trainingPortal:
        html: |
          <!-- educates-test-marker:scenario-04 -->
          <html>
            <head><title>Scenario 04 portal</title></head>
            <body><h1>scenario-04-marker</h1></body>
          </html>
        style: |
          /* scenario-04-css-marker */
          body { font-family: monospace; }
