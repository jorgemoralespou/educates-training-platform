# Values for `helm install -f <this-file>` against the v4 chart.
#
# Local HTTP scenario — see description.md for context.

# Subchart toggles. lookup-service and remote-access are not needed for
# a single-cluster local install.
lookup-service:
  enabled: false
remote-access:
  enabled: false

secrets-manager:
  image:
    repository: ghcr.io/educates/educates-secrets-manager
    tag: "3.7.1"

session-manager:
  image:
    repository: ghcr.io/educates/educates-session-manager
    tag: "3.7.1"

  clusterIngress:
    domain: ${DOMAIN}
    # protocol auto-derives to "http" because tlsCertificateRef.name is empty.

  clusterSecurity:
    policyEngine: Kyverno

  workshopSecurity:
    rulesEngine: Kyverno

  imageRegistry:
    host: ghcr.io
    namespace: educates

  trainingPortal:
    credentials:
      admin:
        username: educates
        password: educates
      robot:
        username: robot@educates
        password: robot
    clients:
      robot:
        id: robot-client-id
        secret: robot-client-secret

  imagePuller:
    enabled: false
