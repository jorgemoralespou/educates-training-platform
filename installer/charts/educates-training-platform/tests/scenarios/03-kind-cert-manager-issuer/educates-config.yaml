# Config for `educates local cluster create --cluster-only --config <this>`
# (cluster-only step) and `educates admin platform deploy --config <this>`
# (platform-deploy step). Both phases consume the same file.
#
# The kind overlay in the v3 installer auto-enables cert-manager + certs
# when `clusterInfrastructure.caCertificateRef` is set. We additionally
# disable the educates package so the v4 chart can install the runtime.

clusterInfrastructure:
  provider: kind
  caCertificateRef:
    name: local-root-ca
    namespace: educates-secrets

clusterSecurity:
  policyEngine: kyverno

clusterIngress:
  domain: ${DOMAIN}

clusterPackages:
  contour:
    enabled: true
  kyverno:
    enabled: true
  external-dns:
    enabled: false
  educates:
    enabled: false
