apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: node-ca-injector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "node-ca-injector.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: node-ca-injector
subjects:
  - kind: ServiceAccount
    name: node-ca-injector
    namespace: {{ .Release.Namespace }}
