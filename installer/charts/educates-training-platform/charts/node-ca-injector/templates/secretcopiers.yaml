{{- /*
Auto-derive a SecretCopier rule pulling the CA Secret into the release
namespace when its ref targets a foreign namespace. Renders independently
of session-manager and lookup-service SecretCopiers so this chart is
installable standalone — under the umbrella each subchart that consumes
the same global ref renders its own rule (idempotent: the same source-
Secret is copied once regardless of how many rules reference it).

Requires the secrets.educates.dev CRDs from the secrets-manager subchart
to be present in-cluster.
*/ -}}
{{- $ns := .Release.Namespace -}}
{{- $ci := include "node-ca-injector.resolvedClusterIngress" . | fromYaml -}}
{{- $caRef := default dict $ci.caCertificateRef -}}
{{- $caName := default "" $caRef.name -}}
{{- $caNs := default "" $caRef.namespace -}}
{{- if and $caName $caNs (ne $caNs $ns) }}
apiVersion: secrets.educates.dev/v1beta1
kind: SecretCopier
metadata:
  name: educates-node-ca-injector-secrets
  labels:
    {{- include "node-ca-injector.labels" . | nindent 4 }}
spec:
  rules:
    - sourceSecret:
        name: {{ $caName | quote }}
        namespace: {{ $caNs | quote }}
      targetNamespaces:
        nameSelector:
          matchNames:
            - {{ $ns | quote }}
{{- end }}
