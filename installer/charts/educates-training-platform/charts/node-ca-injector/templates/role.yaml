apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: node-ca-injector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "node-ca-injector.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "delete", "patch"]
