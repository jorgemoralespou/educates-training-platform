apiVersion: v1
kind: ServiceAccount
metadata:
  name: remote-access
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "remote-access.labels" . | nindent 4 }}
---
# Long-lived service-account-token Secret. Manually created because
# Kubernetes 1.24+ no longer auto-generates these for ServiceAccounts.
# Mounted by the lookup-service Deployment when remote-access.enabled.
apiVersion: v1
kind: Secret
metadata:
  name: remote-access-token
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/service-account.name: remote-access
  labels:
    {{- include "remote-access.labels" . | nindent 4 }}
type: kubernetes.io/service-account-token
