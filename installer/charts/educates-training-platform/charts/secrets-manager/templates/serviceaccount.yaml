apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "secrets-manager.labels" . | nindent 4 }}
---
# Long-lived service account token. Created explicitly because Kubernetes
# 1.24+ no longer auto-generates these for ServiceAccounts. The
# secrets-manager Deployment disables automountServiceAccountToken and
# mounts this Secret at the standard token path so the kopf-based Python
# operator gets a stable, non-rotating token. Behaviour preserved
# unchanged from v3.
apiVersion: v1
kind: Secret
metadata:
  name: secrets-manager-token
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/service-account.name: secrets-manager
  labels:
    {{- include "secrets-manager.labels" . | nindent 4 }}
type: kubernetes.io/service-account-token
