apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "secrets-manager.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "secrets-manager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "secrets-manager.labels" . | nindent 8 }}
        {{- include "secrets-manager.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: secrets-manager
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ include "secrets-manager.image.tag" . }}"
          imagePullPolicy: {{ include "secrets-manager.image.pullPolicy" . }}
          env:
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /healthz?probe=startup
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /healthz?probe=liveness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: token
          secret:
            secretName: secrets-manager-token
