# Values for the session-manager subchart.
#
# In a v4 install, the operator derives these values from the SessionManager CR
# plus EducatesClusterConfig.status. They can also be set directly when
# installing the chart standalone.

# =============================================================================
# Cluster-wide ingress identity
# =============================================================================

# `domain` is required. Chart fails at template time if empty.
# `protocol` is auto-derived from tlsCertificateRef when empty: "http" if no
# ref is set, "https" otherwise. Override only for external TLS termination
# (router terminates TLS and proxies plain HTTP into the cluster).
clusterIngress:
  domain: ""
  class: ""
  protocol: ""

  # Reference to a kubernetes.io/tls Secret holding the wildcard cert for
  # *.<domain>. Required keys: tls.crt, tls.key. When `namespace` is empty
  # the Secret is assumed to live in the release namespace. When set to a
  # different namespace, the chart auto-creates a SecretCopier so the runtime
  # finds the Secret locally.
  tlsCertificateRef:
    name: ""
    namespace: ""

  # Reference to a Secret holding the CA certificate used to verify the
  # wildcard. Required key: ca.crt. Same namespace semantics as the TLS ref.
  caCertificateRef:
    name: ""
    namespace: ""

  # When a CA is provided, optionally inject it into cluster nodes via the
  # node-ca-injector DaemonSet. DaemonSet rendering is not yet wired; the
  # value is accepted and validated, but no resources are produced for it
  # in this chart version. Operator/installer will consume it once the
  # DaemonSet template lands.
  caNodeInjector:
    enabled: false

# =============================================================================
# Security policy enforcement
# =============================================================================

# Cluster-level security policy enforcement.
#
# - Kyverno: installs the bundled cluster ClusterPolicies (PSS baseline +
#   restricted profiles + operational best-practices) directly to the cluster.
#   `additionalKyvernoPolicies` are installed alongside.
# - OpenShiftSCC: installs ClusterRoleBindings binding the session-manager and
#   image-puller ServiceAccounts to the `educates-baseline-scc` ClusterRole.
#   Implies you're on OpenShift; SCC enforcement comes from the platform.
# - PodSecurityStandards: chart installs nothing at this level; PSS is enforced
#   by Kubernetes via namespace labels managed by the runtime.
# - None: no cluster-level policy enforcement. User accepts responsibility.
#
# `additionalKyvernoPolicies` is silently ignored when policyEngine is not
# Kyverno.
clusterSecurity:
  policyEngine: Kyverno   # Kyverno | PodSecurityStandards | OpenShiftSCC | None
  additionalKyvernoPolicies: []
    # - apiVersion: kyverno.io/v1
    #   kind: ClusterPolicy
    #   metadata:
    #     name: my-cluster-wide-extra
    #   spec:
    #     validationFailureAction: Audit
    #     rules:
    #       - name: ...

# Per-workshop policy enforcement. The chart concatenates a curated bundle
# (operational best-practices + Educates-internal `require-ingress-session-name`)
# into the `kyverno-policies.yaml` key of the `educates-config` Secret;
# session-manager clones each rule per workshop environment with a namespace
# selector added.
#
# `additionalKyvernoPolicies` is appended to the same feed and is silently
# ignored when rulesEngine is not Kyverno.
workshopSecurity:
  rulesEngine: Kyverno    # Kyverno | None
  additionalKyvernoPolicies: []
    # - apiVersion: kyverno.io/v1
    #   kind: ClusterPolicy
    #   metadata:
    #     name: my-per-workshop-extra
    #   spec:
    #     rules:
    #       - name: ...

# =============================================================================
# Image registry
# =============================================================================

# Where Educates images are pulled from. Empty `host` means "use the default
# registry baked into image refs." `namespace` is the path prefix under host;
# when empty, images are addressed at the registry root ({host}/{name} rather
# than {host}/{namespace}/{name}).
imageRegistry:
  host: ""
  namespace: ""

# =============================================================================
# Runtime image version + per-image overrides
# =============================================================================

# Version of the Educates *runtime* (the images session-manager pulls when
# spawning child pods, plus the chart's own session-manager + pause images).
# This is decoupled from the chart's own `Chart.appVersion` because v4 does
# not change the runtime — runtime images stay on the v3 series. Used as:
#
#   1. The default `image.tag` for the session-manager Deployment when
#      `image.tag` is empty.
#   2. The default `imagePuller.pauseImage.tag` when empty.
#   3. The `version` field auto-injected into the operator-config blob —
#      session-manager's `image_reference()` reads it as the fallback tag
#      when an image isn't listed in `imageVersions` below.
runtimeVersion: "3.7.1"

# Default per-image overrides supplied by the chart. Mirrors v3's
# carvel-installer `images.yaml` defaults. Two kinds of entries:
#
#   - Educates-published images, pinned to `runtimeVersion`. Listed
#     explicitly so chart users see the full set of images the runtime can
#     pull. When bumping `runtimeVersion`, update these tags too — they are
#     a documented two-place edit, not derived at template time.
#   - Upstream-pinned images (docker-in-docker, loftsh-*, debian-base) that
#     are NOT Educates-published and therefore aren't versioned with
#     `runtimeVersion`. v3's `images.yaml` hard-coded these; we do the same.
#
# Helm replaces lists wholesale on user override. To add or change a single
# entry, copy the full list into your values file and edit there. The
# `imageRegistry.host` / `.namespace` values do NOT relocate these defaults
# — they only affect images that fall through to `image_reference()` at
# runtime (i.e., images NOT in this list). For airgap relocation, override
# the `image:` field of each entry directly.
imageVersions:
  # Educates-published images (pinned to runtimeVersion: 3.7.1)
  - { name: training-portal,        image: "ghcr.io/educates/educates-training-portal:3.7.1" }
  - { name: docker-registry,        image: "ghcr.io/educates/educates-docker-registry:3.7.1" }
  - { name: tunnel-manager,         image: "ghcr.io/educates/educates-tunnel-manager:3.7.1" }
  - { name: image-cache,            image: "ghcr.io/educates/educates-image-cache:3.7.1" }
  - { name: assets-server,          image: "ghcr.io/educates/educates-assets-server:3.7.1" }
  - { name: contour-bundle,         image: "ghcr.io/educates/educates-contour-bundle:3.7.1" }
  - { name: base-environment,       image: "ghcr.io/educates/educates-base-environment:3.7.1" }
  - { name: jdk8-environment,       image: "ghcr.io/educates/educates-jdk8-environment:3.7.1" }
  - { name: jdk11-environment,      image: "ghcr.io/educates/educates-jdk11-environment:3.7.1" }
  - { name: jdk17-environment,      image: "ghcr.io/educates/educates-jdk17-environment:3.7.1" }
  - { name: jdk21-environment,      image: "ghcr.io/educates/educates-jdk21-environment:3.7.1" }
  - { name: conda-environment,      image: "ghcr.io/educates/educates-conda-environment:3.7.1" }
  # Upstream pins (NOT Educates-published; do not bump with runtimeVersion)
  - { name: debian-base-image,      image: "debian:sid-20230502-slim" }
  - { name: docker-in-docker,       image: "docker:27.5.1-dind" }
  - { name: loftsh-kubernetes-v1.31, image: "ghcr.io/loft-sh/kubernetes:v1.31.1" }
  - { name: loftsh-kubernetes-v1.32, image: "ghcr.io/loft-sh/kubernetes:v1.32.1" }
  - { name: loftsh-kubernetes-v1.33, image: "ghcr.io/loft-sh/kubernetes:v1.33.4" }
  - { name: loftsh-kubernetes-v1.34, image: "ghcr.io/loft-sh/kubernetes:v1.34.0" }
  - { name: loftsh-vcluster,        image: "ghcr.io/loft-sh/vcluster-oss:0.30.2" }

# =============================================================================
# Session-manager pod
# =============================================================================

image:
  repository: ghcr.io/educates/educates-session-manager
  # Empty tag falls through to `runtimeVersion`.
  tag: ""
  pullPolicy: ""

# Image-pull Secrets attached to the session-manager pod's own PodSpec. These
# are the Secrets needed to pull the session-manager image itself. For Secrets
# that should propagate into workshop namespaces, see `secretPropagation` below.
imagePullSecrets: []

resources: {}

# Grant the session-manager ServiceAccount the built-in `cluster-admin`
# ClusterRole. Off by default; enable only when workshops need to manage
# cluster-scoped resources beyond what the aggregated `educates-session-manager`
# ClusterRole grants. Note: changed from v3 default of `true`.
clusterAdmin: false

# =============================================================================
# Training portal defaults
# =============================================================================

# Empty values cause the runtime to generate them on first reconciliation.
# The chart deliberately does NOT use `randAlphaNum` defaults here because that
# would rotate values on every `helm upgrade` and break in-flight workshops.
trainingPortal:
  credentials:
    admin:
      username: ""
      password: ""
    robot:
      username: ""
      password: ""
  clients:
    robot:
      id: ""
      secret: ""

# Optional override for the cookie domain used by training portal and
# workshop sessions. Empty means "use the ingress domain."
sessionCookies:
  domain: ""

# =============================================================================
# Storage
# =============================================================================

# `class` empty uses the cluster default StorageClass.
# `user` is null by default (filesystem chown unset). Set to a numeric UID
# only when the storage class maps to NFS and the server requires a specific
# user. Cannot be combined with PodSecurityStandards/Policies enforcement.
# `group` defaults to 1, suitable for clusters with pod security policies.
clusterStorage:
  class: ""
  user: null
  group: 1

# =============================================================================
# Container runtime
# =============================================================================

# Optional runtimeClass applied to workshop containers (e.g., "kata" for
# VM-isolated workshops). Empty leaves the cluster default.
clusterRuntime:
  class: ""

# =============================================================================
# Cluster network policy
# =============================================================================

# CIDRs that workshops are blocked from reaching. Default blocks the AWS EC2
# instance metadata endpoint (IPv4 and IPv6). Set to [] to remove all blocks.
clusterNetwork:
  blockCIDRs:
    - "169.254.169.254/32"
    - "fd00:ec2::254/128"

# =============================================================================
# Docker daemon (only used when workshops build images)
# =============================================================================

dockerDaemon:
  networkMTU: 1400
  # Mirror cache to mitigate Docker Hub pull limits. Set remoteURL to e.g.
  # "https://registry-1.docker.io" to enable.
  proxyCache:
    remoteURL: ""
    username: ""
    password: ""

# =============================================================================
# Analytics
# =============================================================================

workshopAnalytics:
  google:
    trackingId: ""
  clarity:
    trackingId: ""
  amplitude:
    trackingId: ""
  webhook:
    url: ""

# =============================================================================
# Website styling and theming
# =============================================================================

# Two ways to supply themes:
#
#   `inline` — HTML/JS/CSS authored directly in values. Each populated leaf
#     becomes a stringData entry in the `default-website-theme` Secret, which
#     the runtime uses as the fallback theme. Convenient for small tweaks
#     without managing a separate Secret.
#
#   `themeDataRefs` — references to external theme Secrets that already hold
#     the assets. The chart makes them available to the runtime and auto-
#     creates a SecretCopier when a ref's namespace differs from the release
#     namespace.
websiteStyling:
  inline:
    workshopDashboard:
      html: ""
      script: ""
      style: ""
    workshopInstructions:
      html: ""
      script: ""
      style: ""
    workshopStarted:
      html: ""
    workshopFinished:
      html: ""
    trainingPortal:
      html: ""
      script: ""
      style: ""

  # Name of the theme to use as default. Must match a key in `themeDataRefs`.
  # Empty means "use the inline default theme (above)."
  defaultTheme: ""

  # External theme Secrets to make available. Each ref points at a Secret
  # holding theme assets. When `namespace` differs from the release namespace
  # the chart auto-creates a SecretCopier.
  themeDataRefs: []
    # - name: my-theme
    #   namespace: themes-source

  # Allowed parent frames for embedding workshop sessions (CSP
  # frame-ancestors directive).
  frameAncestors: []

# =============================================================================
# Image puller DaemonSet
# =============================================================================

# When enabled, runs an init-container per image in `prePullImages` (each
# running `/bin/true`) so the kubelet caches them on every node, plus a
# long-lived pause container to keep the DS alive. Useful for clusters where
# workshop session start time is dominated by image pull.
imagePuller:
  enabled: false
  # Pause image used as the long-lived "keepalive" container in the DaemonSet.
  # Tag defaults to chart appVersion when empty.
  pauseImage:
    repository: ghcr.io/educates/educates-pause-container
    tag: ""
    pullPolicy: ""
  # Full image references to pre-pull. The chart does not compute these from
  # short names; the operator (or chart user) supplies fully qualified refs so
  # any registry mirror or relocation is honoured.
  prePullImages: []
    # - ghcr.io/educates/training-portal:4.0.0-alpha.1

# =============================================================================
# Secret propagation
# =============================================================================
#
# The session-manager runtime distributes pull secrets and website themes
# across workshop namespaces using SecretCopier and SecretInjector resources
# from secrets.educates.dev.
#
# Note: ingress TLS and CA propagation is auto-derived from
# `clusterIngress.tlsCertificateRef` and `clusterIngress.caCertificateRef`
# when those refs target a namespace other than the release namespace. There
# is no longer an explicit knob for it.

secretPropagation:
  # Names of image-pull Secrets that already exist in the release namespace
  # and should be (a) propagated into every workshop-portal and
  # workshop-environment namespace, and (b) injected into ServiceAccounts
  # in those namespaces.
  imagePullSecretNames: []
    # - my-registry-pull-secret

  upstream:
    # External Secrets to copy INTO the release namespace before propagation.
    imagePullSecrets: []
      # - { name: my-pull-secret, namespace: source-ns }
    websiteThemes: []
      # - { name: my-theme, namespace: source-ns }

# =============================================================================
# Escape hatch
# =============================================================================
#
# Opaque map deep-merged on top of the typed-values-derived
# `educates-operator-config.yaml` Secret content. Use only for runtime fields
# not yet promoted to typed values. Newly added fields should land here first
# and be promoted in a subsequent chart release.
config: {}
