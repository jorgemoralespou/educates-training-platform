apiVersion: policies.kyverno.io/v1alpha1
kind: ValidatingPolicy
metadata:
  name: disallow-ingress-nginx-custom-snippets
  annotations:
    policies.kyverno.io/title: Disallow Custom Snippets in ValidatingPolicy
    policies.kyverno.io/category: Security, NGINX Ingress in ValidatingPolicy
    policies.kyverno.io/subject: ConfigMap, Ingress
    policies.kyverno.io/description: >-
      Users that can create or update ingress objects can use the custom snippets
      feature to obtain all secrets in the cluster (CVE-2021-25742). This policy
      disables allow-snippet-annotations in the ingress-nginx configuration and
      blocks *-snippet annotations on an Ingress.
      See: https://github.com/kubernetes/ingress-nginx/issues/7837
      Hand-ported to ValidatingPolicy from nginx-ingress-cel (no upstream -vpol variant
      exists). The two original rules (ConfigMap, Ingress) become one policy matching
      both kinds, with each validation guarded by request.kind so it only applies to
      the resource it was written for.
spec:
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["configmaps"]
      - apiGroups:   ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["ingresses"]
  validations:
    - expression: >-
        request.kind.kind != 'ConfigMap' ||
        object.?data[?'allow-snippet-annotations'].orValue('false') == 'false'
      message: "ingress-nginx allow-snippet-annotations must be set to false"
    - expression: >-
        request.kind.kind != 'Ingress' ||
        !object.metadata.?annotations.orValue({}).exists(annotation, annotation.endsWith('-snippet'))
      message: "ingress-nginx custom snippets are not allowed"
