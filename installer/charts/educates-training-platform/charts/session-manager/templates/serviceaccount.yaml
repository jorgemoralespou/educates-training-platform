apiVersion: v1
kind: ServiceAccount
metadata:
  name: session-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "session-manager.labels" . | nindent 4 }}
---
# Long-lived service-account-token Secret. Manually created because
# Kubernetes 1.24+ no longer auto-generates these for ServiceAccounts.
# The session-manager Deployment disables automountServiceAccountToken
# and mounts this Secret at the standard token path. Behaviour
# preserved unchanged from v3.
apiVersion: v1
kind: Secret
metadata:
  name: session-manager-token
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/service-account.name: session-manager
  labels:
    {{- include "session-manager.labels" . | nindent 4 }}
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-puller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "session-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: image-puller
