{{- /*
SecretCopier resources distribute Secrets across namespaces. The
secrets.educates.dev CRDs are owned by the secrets-manager subchart,
which is a hard dependency of session-manager (see decisions.md).

Four kinds of copy rules:
  1. Ingress TLS + CA from external source namespaces into the release
     namespace (when those Secrets aren't already local).
  2. Image-pull Secrets from external source namespaces into the
     release namespace.
  3. Image-pull Secrets in the release namespace pushed downstream into
     workshop-portal and workshop-environment namespaces (selected by
     label).
  4. Website-theme Secrets from external source namespaces into the
     release namespace.

Each rule renders only when its inputs are present. Rules referencing a
source namespace that equals the release namespace are skipped (no copy
needed).
*/ -}}
{{- $ns := .Release.Namespace -}}
{{- $tlsName := .Values.secretPropagation.upstream.ingressTLS.name -}}
{{- $tlsNs := .Values.secretPropagation.upstream.ingressTLS.namespace -}}
{{- $caName := .Values.secretPropagation.upstream.ingressCA.name -}}
{{- $caNs := .Values.secretPropagation.upstream.ingressCA.namespace -}}
{{- $tlsRule := and $tlsName $tlsNs (ne $tlsNs $ns) -}}
{{- $caRule := and $caName $caNs (ne $caNs $ns) -}}
{{- if or $tlsRule $caRule }}
apiVersion: secrets.educates.dev/v1beta1
kind: SecretCopier
metadata:
  name: educates-ingress-secrets
  labels:
    {{- include "session-manager.labels" . | nindent 4 }}
spec:
  rules:
    {{- if $tlsRule }}
    - sourceSecret:
        name: {{ $tlsName | quote }}
        namespace: {{ $tlsNs | quote }}
      targetNamespaces:
        nameSelector:
          matchNames:
            - {{ $ns | quote }}
    {{- end }}
    {{- if $caRule }}
    - sourceSecret:
        name: {{ $caName | quote }}
        namespace: {{ $caNs | quote }}
      targetNamespaces:
        nameSelector:
          matchNames:
            - {{ $ns | quote }}
    {{- end }}
{{- end }}
{{- $upstreamPullSecrets := list -}}
{{- range .Values.secretPropagation.upstream.imagePullSecrets -}}
  {{- if and .name .namespace (ne .namespace $ns) -}}
    {{- $upstreamPullSecrets = append $upstreamPullSecrets . -}}
  {{- end -}}
{{- end -}}
{{- if $upstreamPullSecrets }}
---
apiVersion: secrets.educates.dev/v1beta1
kind: SecretCopier
metadata:
  name: educates-upstream-image-pull-secrets
  labels:
    {{- include "session-manager.labels" . | nindent 4 }}
spec:
  rules:
    {{- range $upstreamPullSecrets }}
    - sourceSecret:
        name: {{ .name | quote }}
        namespace: {{ .namespace | quote }}
      targetNamespaces:
        nameSelector:
          matchNames:
            - {{ $ns | quote }}
    {{- end }}
{{- end }}
{{- if .Values.secretPropagation.imagePullSecretNames }}
---
apiVersion: secrets.educates.dev/v1beta1
kind: SecretCopier
metadata:
  name: educates-downstream-image-pull-secrets
  labels:
    {{- include "session-manager.labels" . | nindent 4 }}
spec:
  rules:
    {{- range .Values.secretPropagation.imagePullSecretNames }}
    - sourceSecret:
        name: {{ . | quote }}
        namespace: {{ $ns | quote }}
      targetNamespaces:
        labelSelector:
          matchLabels:
            training.educates.dev/component: portal
    - sourceSecret:
        name: {{ . | quote }}
        namespace: {{ $ns | quote }}
      targetNamespaces:
        labelSelector:
          matchLabels:
            training.educates.dev/component: environment
    {{- end }}
{{- end }}
{{- $upstreamThemes := list -}}
{{- range .Values.secretPropagation.upstream.websiteThemes -}}
  {{- if and .name .namespace (ne .namespace $ns) -}}
    {{- $upstreamThemes = append $upstreamThemes . -}}
  {{- end -}}
{{- end -}}
{{- if $upstreamThemes }}
---
apiVersion: secrets.educates.dev/v1beta1
kind: SecretCopier
metadata:
  name: educates-upstream-website-themes
  labels:
    {{- include "session-manager.labels" . | nindent 4 }}
spec:
  rules:
    {{- range $upstreamThemes }}
    - sourceSecret:
        name: {{ .name | quote }}
        namespace: {{ .namespace | quote }}
      targetNamespaces:
        nameSelector:
          matchNames:
            - {{ $ns | quote }}
    {{- end }}
{{- end }}
