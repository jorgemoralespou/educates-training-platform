apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "session-manager.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "session-manager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "session-manager.labels" . | nindent 8 }}
        {{- include "session-manager.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the Deployment whenever the operator config changes so
        # session-manager picks up the new YAML without a manual restart.
        checksum/config: {{ include (print $.Template.BasePath "/secret-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: session-manager
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ include "session-manager.image.tag" . }}"
          imagePullPolicy: {{ include "session-manager.image.pullPolicy" . }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /healthz?probe=startup
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /healthz?probe=liveness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /opt/app-root/config/
            - name: token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: educates-config
        - name: token
          secret:
            secretName: session-manager-token
