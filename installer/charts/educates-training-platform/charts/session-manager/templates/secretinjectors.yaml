{{- if .Values.secretPropagation.imagePullSecretNames }}
apiVersion: secrets.educates.dev/v1beta1
kind: SecretInjector
metadata:
  name: educates-image-pull-secrets
  labels:
    {{- include "session-manager.labels" . | nindent 4 }}
spec:
  rules:
    - targetNamespaces:
        labelSelector:
          matchLabels:
            training.educates.dev/component: portal
      sourceSecrets:
        nameSelector:
          matchNames:
            {{- range .Values.secretPropagation.imagePullSecretNames }}
            - {{ . | quote }}
            {{- end }}
      serviceAccounts:
        labelSelector:
          matchLabels:
            training.educates.dev/component: portal
    - targetNamespaces:
        labelSelector:
          matchLabels:
            training.educates.dev/component: environment
      sourceSecrets:
        nameSelector:
          matchNames:
            {{- range .Values.secretPropagation.imagePullSecretNames }}
            - {{ . | quote }}
            {{- end }}
      serviceAccounts:
        labelSelector:
          matchLabels:
            training.educates.dev/component: environment
    - targetNamespaces:
        labelSelector:
          matchLabels:
            training.educates.dev/component: environment
      sourceSecrets:
        nameSelector:
          matchNames:
            {{- range .Values.secretPropagation.imagePullSecretNames }}
            - {{ . | quote }}
            {{- end }}
      serviceAccounts:
        labelSelector:
          matchLabels:
            training.educates.dev/component: session
{{- end }}
---
# `educates-registry-credentials` is a fixed Secret name that the runtime
# materialises per workshop session for in-session image-build use. The
# injector wires it into the default ServiceAccount of every session
# namespace. Always rendered — does nothing until the Secret exists.
apiVersion: secrets.educates.dev/v1beta1
kind: SecretInjector
metadata:
  name: educates-registry-credentials
  labels:
    {{- include "session-manager.labels" . | nindent 4 }}
spec:
  rules:
    - targetNamespaces:
        labelSelector:
          matchLabels:
            training.educates.dev/component: session
      sourceSecrets:
        nameSelector:
          matchNames:
            - educates-registry-credentials
      serviceAccounts:
        nameSelector:
          matchNames:
            - default
