{{- /*
Cluster-wide Kyverno policies, gated on
`clusterSecurity.policyEngine == "Kyverno"`. Two sources:

  1. The bundled Pod Security Standards profiles (baseline + restricted)
     under files/kyverno-policies/cluster-policies/. These are now
     `ValidatingPolicy` resources (policies.kyverno.io) vendored from
     kyverno/policies' pod-security-vpol set.
  2. User-supplied `clusterSecurity.additionalKyvernoPolicies` — site-specific
     policy objects platform admins want installed cluster-wide alongside the
     bundle (either the new Policy types or the legacy ClusterPolicy).

This template is policy-type-agnostic: it emits each document verbatim. The
bundled ValidatingPolicies use `validationActions: [Audit]` so violations are
logged but workloads aren't blocked. User-supplied policies use whatever
action they set.
*/ -}}
{{- $cs := include "session-manager.resolvedClusterSecurity" . | fromYaml -}}
{{- if eq $cs.policyEngine "Kyverno" -}}
{{- range $path, $_ := .Files.Glob "files/kyverno-policies/cluster-policies/*/*.yaml" }}
---
{{ $.Files.Get $path | trim }}
{{- end }}
{{- range default list $cs.additionalKyvernoPolicies }}
---
{{ toYaml . | trim }}
{{- end }}
{{- end -}}
