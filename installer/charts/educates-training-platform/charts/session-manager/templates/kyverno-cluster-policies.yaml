{{- /*
Cluster-wide Kyverno ClusterPolicy resources, gated on
`clusterSecurity.policyEngine == "Kyverno"`. Two sources:

  1. The bundled v3-vendored Pod Security Standards profiles (baseline +
     restricted) under files/kyverno-policies/cluster-policies/. Mirrors v3's
     `01-clusterpolicies.yaml`.
  2. User-supplied `clusterSecurity.additionalKyvernoPolicies` — site-specific
     ClusterPolicy objects platform admins want installed cluster-wide
     alongside the bundle.

The bundled YAMLs use `validationFailureAction: Audit` so violations are
logged but workloads aren't blocked. User-supplied policies use whatever
`validationFailureAction` the admin sets in each entry.
*/ -}}
{{- $cs := include "session-manager.resolvedClusterSecurity" . | fromYaml -}}
{{- if eq $cs.policyEngine "Kyverno" -}}
{{- range $path, $_ := .Files.Glob "files/kyverno-policies/cluster-policies/*/*.yaml" }}
---
{{ $.Files.Get $path | trim }}
{{- end }}
{{- range default list $cs.additionalKyvernoPolicies }}
---
{{ toYaml . | trim }}
{{- end }}
{{- end -}}
