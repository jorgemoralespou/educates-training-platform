{{- $ci := include "lookup-service.resolvedClusterIngress" . | fromYaml -}}
{{- $caRef := default dict $ci.caCertificateRef -}}
{{- $caEnabled := and $caRef.name true -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lookup-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lookup-service.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "lookup-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lookup-service.labels" . | nindent 8 }}
        {{- include "lookup-service.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: lookup-service
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: lookup-service
          image: "{{ include "lookup-service.image.repository" . }}:{{ include "lookup-service.image.tag" . }}"
          imagePullPolicy: {{ include "lookup-service.image.pullPolicy" . }}
          ports:
            - containerPort: 8080
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.remoteAccessTokenMount.enabled $caEnabled }}
          volumeMounts:
            {{- if .Values.remoteAccessTokenMount.enabled }}
            - name: cluster-access-token
              mountPath: /opt/cluster-access-token
            {{- end }}
            {{- if $caEnabled }}
            # The image's start script appends ca.crt from this mount to the
            # system CA bundle at /opt/app-root/ca-bundle.crt, which the
            # SSL_CERT_FILE, REQUESTS_CA_BUNDLE and related variables baked
            # into the image already point at. Required when lookup-service
            # verifies TLS against a private or self-signed CA when calling
            # other clusters' training portals. Mounted as a directory, not
            # via subPath, so a rotated Secret propagates into the pod for
            # the next restart.
            - name: cluster-ca
              mountPath: /opt/app-root/certs/ingress-ca
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.remoteAccessTokenMount.enabled $caEnabled }}
      volumes:
        {{- if .Values.remoteAccessTokenMount.enabled }}
        - name: cluster-access-token
          secret:
            secretName: remote-access-token
        {{- end }}
        {{- if $caEnabled }}
        - name: cluster-ca
          secret:
            secretName: {{ $caRef.name | quote }}
        {{- end }}
      {{- end }}
