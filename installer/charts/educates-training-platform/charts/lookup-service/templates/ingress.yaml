{{- if not .Values.ingress.host }}
{{- fail "lookup-service: .Values.ingress.host must be set (e.g. lookup.workshops.example.com)." }}
{{- end }}
{{- $ci := include "lookup-service.resolvedClusterIngress" . | fromYaml -}}
{{- $tlsRef := default dict $ci.tlsCertificateRef -}}
{{- $tlsSecret := $tlsRef.name -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lookup-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lookup-service.labels" . | nindent 4 }}
  {{- if $tlsSecret }}
  annotations:
    ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lookup-service
                port:
                  number: 80
  {{- if $tlsSecret }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ $tlsSecret | quote }}
  {{- end }}
