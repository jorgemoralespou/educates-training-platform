{{- /*
Auto-derive SecretCopier rules pulling the wildcard TLS Secret + the CA
Secret into the release namespace when their refs target a foreign
namespace. Renders independently of the session-manager subchart's
SecretCopier so this chart is installable standalone — under the umbrella
both subcharts render their own rules (idempotent: the same source-Secret
is copied once regardless of how many copy rules reference it).

Requires the secrets.educates.dev CRDs from the secrets-manager subchart
to be present in-cluster.
*/ -}}
{{- $ns := .Release.Namespace -}}
{{- $ci := include "lookup-service.resolvedClusterIngress" . | fromYaml -}}
{{- $tlsRef := default dict $ci.tlsCertificateRef -}}
{{- $caRef := default dict $ci.caCertificateRef -}}
{{- $tlsName := default "" $tlsRef.name -}}
{{- $tlsNs := default "" $tlsRef.namespace -}}
{{- $caName := default "" $caRef.name -}}
{{- $caNs := default "" $caRef.namespace -}}
{{- $tlsRule := and $tlsName $tlsNs (ne $tlsNs $ns) -}}
{{- $caRule := and $caName $caNs (ne $caNs $ns) -}}
{{- if or $tlsRule $caRule }}
apiVersion: secrets.educates.dev/v1beta1
kind: SecretCopier
metadata:
  name: educates-lookup-service-ingress-secrets
  labels:
    {{- include "lookup-service.labels" . | nindent 4 }}
spec:
  rules:
    {{- if $tlsRule }}
    - sourceSecret:
        name: {{ $tlsName | quote }}
        namespace: {{ $tlsNs | quote }}
      targetNamespaces:
        nameSelector:
          matchNames:
            - {{ $ns | quote }}
    {{- end }}
    {{- if $caRule }}
    - sourceSecret:
        name: {{ $caName | quote }}
        namespace: {{ $caNs | quote }}
      targetNamespaces:
        nameSelector:
          matchNames:
            - {{ $ns | quote }}
    {{- end }}
{{- end }}
