# Values for the lookup-service subchart.

# Where Educates images are pulled from. Defaults compose image refs as
# `{host}/{namespace}/educates-<name>:<Chart.appVersion>`. Override at the
# umbrella level under `global.imageRegistry` to redirect every Educates-
# image reference (across all subcharts) in one knob; this subchart-local
# block remains as the standalone-install default.
imageRegistry:
  host: "ghcr.io"
  namespace: "educates"

image:
  # Empty `repository` derives `{imageRegistry.host}/{imageRegistry.namespace}/educates-lookup-service`.
  # Empty `tag` falls through to `Chart.AppVersion`.
  repository: ""
  tag: ""
  pullPolicy: ""

# Image pull secret references in the operator namespace.
imagePullSecrets: []

resources: {}

ingress:
  # Fully-qualified hostname for the lookup-service ingress (e.g.
  # `lookup.workshops.example.com`). The v4 operator computes this from
  # the LookupService CR's prefix and EducatesClusterConfig.status.domain.
  host: ""
  # IngressClass name. Empty leaves the cluster default.
  className: ""
  tls:
    # Name of the kubernetes.io/tls Secret in the release namespace that
    # backs this Ingress's TLS. Empty disables TLS on the Ingress.
    secretName: ""

# Cluster CA injection. When `secretName` is set, an init container builds
# a CA-trust store from the named Secret (which must contain `ca.crt`) and
# the lookup-service container mounts the resulting trust store. Used when
# the cluster's ingress is fronted by a self-signed or private CA that the
# lookup-service must trust when calling out to other clusters.
caTrust:
  secretName: ""
  # Image used to run the trust-store setup. Defaults to the workshop
  # base-environment image because that's where `setup-certificates`
  # lives — preserves v3 behaviour. Override if you've relocated the
  # workshop base image.
  initImage:
    repository: ghcr.io/educates/educates-base-environment
    tag: ""
    pullPolicy: ""

# When true, the Deployment mounts the `remote-access-token` Secret at
# /opt/cluster-access-token. Set true automatically by the operator when
# the umbrella's `remote-access.enabled` is on; can be set explicitly when
# installing this subchart standalone. The lookup-service runtime only
# requires this when serving a "local" ClusterConfig target (no kubeconfig
# secretRef).
remoteAccessTokenMount:
  enabled: true
