[project]
name = "training-portal"
version = "0.1.0"
description = "Training portal for the Educates training platform."
requires-python = ">=3.13,<3.14"
dependencies = [
    "mod_wsgi==6.0.4",
    "Django==4.2.30",
    "django-registration==3.4",
    "django-crispy-forms==2.1",
    "crispy-bootstrap5==2023.10",
    "wrapt==1.16.0",
    "django-oauth-toolkit==2.3.0",
    "django-cors-headers==4.3.1",
    "requests==2.33.0",
    "django-csp==3.7",
    "kopf[full-auth]==1.37.4",
    "pykube-ng==23.6.0",
    "rstr==3.2.2",
]

[dependency-groups]
dev = [
    "black==26.3.1",
]

[tool.uv]
# This is an application run from source, not an installable package; uv sync
# should only install the dependencies.
package = false
