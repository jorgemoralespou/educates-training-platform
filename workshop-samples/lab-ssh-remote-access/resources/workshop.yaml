apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: lab-ssh-remote-access
spec:
  title: SSH Remote Access Test
  description: Test workshop for exercising remote SSH access to a workshop session over the websocket tunnelling proxy, connecting back into the same session container using both the Educates CLI and the Python reference tunnel client.
  duration: 15m
  difficulty: intermediate
  publish:
    image: "$(image_repository)/lab-ssh-remote-access-files:$(workshop_version)"
  workshop:
    files:
    - image:
        url: "$(image_repository)/lab-ssh-remote-access-files:$(workshop_version)"
      includePaths:
      - /exercises/**
      - /workshop/**
      - /README.md
  session:
    namespaces:
      security:
        token:
          enabled: false
    applications:
      terminal:
        enabled: true
        layout: split
      editor:
        enabled: true
      sshd:
        enabled: true
        tunnel:
          enabled: true
